# This project is developed on a memory-constrained machine. Keep Gradle's
# worker pool small so a debug build can finish without exhausting the system
# page file. JVM sizing is supplied by the launch command so --no-daemon can
# run the build in a single process.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.workers.max=1
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.vfs.watch=false
android.useAndroidX=true
kotlin.code.style=official

